var P0=new V(-1.1,0,0),P1=new V(-0.9,3.9,0),P2=new V(0.9,3.9,0),P3=new V(1.1,0,0);
function bz(s){var u=1-s;return new V(u*u*u*P0.x+3*u*u*s*P1.x+3*u*s*s*P2.x+s*s*s*P3.x,u*u*u*P0.y+3*u*u*s*P1.y+3*u*s*s*P2.y+s*s*s*P3.y,0);}
function ribTex(){var c=canv(8,16),g=c.getContext('2d');g.fillStyle='#0f1012';g.fillRect(0,0,8,16);g.fillStyle='#2b2c30';g.fillRect(0,2,8,2);g.fillRect(0,10,8,2);var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
function gripTex(){var c=canv(64,88),g=c.getContext('2d');g.fillStyle='#0c0c0d';g.fillRect(0,0,64,88);g.fillStyle='#2b2c30';for(var r=0;r<6;r++)for(var k=0;k<4;k++){g.beginPath();g.arc(8+k*16,8+r*14,4,0,6.283);g.fill();}return mkTex(c);}
strapM.map=ribTex();strapM.bumpMap=strapM.map;strapM.bumpScale=0.8;
var gripM=new THREE.MeshStandardMaterial({map:gripTex(),roughness:0.7,side:THREE.DoubleSide});
(function(){
  var N=160,pos=[],uv=[],idx=[],ls=[],len=0,prev=bz(0),i;
  for(i=0;i<=N;i++){var p=bz(i/N);len+=p.distanceTo(prev);prev=p;ls.push(len);}
  for(i=0;i<=N;i++){var q=bz(i/N),v=ls[i]/0.03;pos.push(q.x,q.y,-0.045,q.x,q.y,0.045);uv.push(0,v,1,v);if(i<N){var a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}}
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
  sg.add(new THREE.Mesh(g,strapM));
  function patch(s){var p=bz(s),t=bz(Math.min(1,s+0.01)).sub(p).normalize(),n=new V(-t.y,t.x,0),m=new THREE.Mesh(new THREE.PlaneGeometry(0.09,0.12),gripM);
    m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(new V(0,0,1),t,n));m.position.copy(p).addScaledVector(n,0.004);sg.add(m);}
  patch(0.014);patch(0.986);
  var bk=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.055,0.03),blk);bk.position.copy(bz(0.05));sg.add(bk);
  [-1,1].forEach(function(sx){var h=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.12,0.03),blk);h.position.set(sx*1.09,0.03,0);sg.add(h);});
})();
bag.traverse(function(o){if(o.isMesh&&o.material!==bagTopM)o.castShadow=true;});

/* Couleurs */
function setColor(k){
  var p=PAL[k];
  seatM.color.copy(col(p.fabric));zipM.color.copy(col(p.zip));tubeM.color.copy(col(p.metal));sleeveM.color.copy(col(p.sleeve));
  liningM.color.copy(col(p.lining));slingM.color.copy(col(p.sling));bagZipM.color.copy(col(p.bzip));
  if(topM.map)topM.map.dispose();topM.map=topTex(p);topM.needsUpdate=true;
  if(bagTopM.map)bagTopM.map.dispose();bagTopM.map=bagTex(p);bagTopM.needsUpdate=true;
  document.getElementById('sub').textContent=p.n;
  Array.prototype.forEach.call(document.querySelectorAll('#sw button'),function(b){b.classList.toggle('on',b.dataset.k===k);});
}
var keys=Object.keys(PAL),sw=document.getElementById('sw');
keys.forEach(function(k){var b=document.createElement('button');b.dataset.k=k;b.setAttribute('aria-label',PAL[k].n);b.style.background=PAL[k].sw;b.addEventListener('click',function(){setColor(k);});sw.appendChild(b);});
if(keys.length<2)sw.style.display='none';
setColor(keys[0]);
window.addEventListener('message',function(e){var d=e.data;if(d&&d.stoolColor&&PAL[d.stoolColor]){setColor(d.stoolColor);}});

var controls=new THREE.OrbitControls(camera,cv);
controls.target.set(0,0.5,0);controls.enableDamping=true;controls.dampingFactor=0.07;
controls.minDistance=2;controls.maxDistance=12;controls.maxPolarAngle=Math.PI*0.72;
controls.autoRotate=true;controls.autoRotateSpeed=2;
var rt;controls.addEventListener('start',function(){controls.autoRotate=false;clearTimeout(rt);});
controls.addEventListener('end',function(){rt=setTimeout(function(){controls.autoRotate=true;},2500);});

/* Transformation tabouret <-> sac : t=0 tabouret, t=1 sac */
var X=new V(1,0,0),Z=new V(0,0,1),qx=new THREE.Quaternion(),qz=new THREE.Quaternion();
qx.setFromAxisAngle(X,Math.PI/2);qz.setFromAxisAngle(Z,Math.PI);var qT=new THREE.Quaternion().copy(qz).multiply(qx),qInv=new THREE.Quaternion().setFromAxisAngle(X,Math.PI);
function ss(a,b,x){x=Math.min(1,Math.max(0,(x-a)/(b-a)));return x*x*(3-2*x);}
function applyPose(t){
  /* tout reste attaché : 1 on retourne le tabouret, 2 les 4 tiges se rejoignent au milieu,
     3 le faisceau pivote (étape 7) et se couche dans la pochette creuse, 4 le sac se redresse, 5 la bandoulière se déploie */
  var u1=ss(0,0.22,t),uf=ss(0.2,0.42,t),ui=ss(0.4,0.62,t),us=ss(0.74,0.94,t),ust=ss(0.94,1,t);
  frames[0].g.rotation.x=0.72*uf;frames[1].g.rotation.x=-0.72*uf;frames[1].g.position.z=0.045*uf;
  frameRoot.position.y=0.45+0.45*ui;frameRoot.rotation.x=ui*Math.PI/2;frameRoot.scale.y=1-0.3*ui;
  if(us>0){pp.quaternion.copy(qInv).slerp(qT,us);}else{pp.quaternion.setFromAxisAngle(X,Math.PI*u1);}
  pp.position.y=0.925-0.84*u1+0.9*Math.sin(Math.PI*u1)+0.365*us;
  pp.scale.set(1+0.9*us,1+1.47*us,1);
  var showBag=t>=0.94;bag.visible=showBag;pp.visible=!showBag;
  sg.scale.y=Math.max(0.001,ust);
  controls.target.y=0.5-0.1*u1+1.2*us;
}
var tcur=0,tgoal=0,last=performance.now(),tb=document.getElementById('trBtn'),camDist=4.8,camAuto=false;
tb.addEventListener('click',function(){tgoal=tgoal?0:1;tb.textContent=tgoal?BZ.toStool:BZ.toSac;camDist=tgoal?7.6:4.8;camAuto=true;});
function resize(){
  var w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?58:35;camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize);resize();
renderer.setAnimationLoop(function(){
  var n=performance.now(),dt=Math.min((n-last)/1000,0.05);last=n;
  if(tcur!==tgoal){var d=tgoal-tcur,st=dt*0.42;tcur+=Math.abs(d)<=st?d:(d>0?st:-st);}
  applyPose(tcur);
  if(camAuto){var off=camera.position.clone().sub(controls.target),dc=off.length();camera.position.copy(controls.target).addScaledVector(off.normalize(),dc+(camDist-dc)*0.04);if(Math.abs(camDist-dc)<0.02)camAuto=false;}
  controls.update();renderer.render(scene,camera);
});
})();
</script>
