<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commander — Bledouxe | Zenith™</title>
<link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#050608; --gold:#d9a94a; --gold-light:#f6dfa0;
    --blue:#3fc8ff; --ember:#ff6a1f; --text:#e9e6dd; --text-dim:#a3a09a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#000;color:var(--text);font-family:'Barlow',sans-serif;overflow:hidden;height:100%;width:100%;}
  h1,h2,h3,.brand-font{font-family:'Orbitron',sans-serif;letter-spacing:0.04em;}
  canvas{display:block;}
  #scene-canvas{position:fixed;inset:0;z-index:1;}

  /* ---------- top bar ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;
    padding:1.1rem 2rem;
    pointer-events:none;
  }
  .topbar a.back{
    pointer-events:auto;
    font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;letter-spacing:0.1em;text-transform:uppercase;
    color:var(--text-dim);border:1px solid rgba(217,169,74,0.3);padding:0.5rem 1rem;border-radius:3px;
    text-decoration:none;transition:color .2s,border-color .2s;
  }
  .topbar a.back:hover{color:var(--gold-light);border-color:var(--gold);}
  .brand{font-size:0.85rem;color:var(--gold-light);font-weight:700;letter-spacing:0.08em;}

  /* ---------- loader ---------- */
  #loader{
    position:fixed;inset:0;z-index:100;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;
    transition:opacity .8s ease;
  }
  #loader img{width:80px;opacity:0.9;animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:0.5;transform:scale(0.95);}50%{opacity:1;transform:scale(1.05);}}
  #loader .loader-text{font-family:'Barlow Condensed',sans-serif;letter-spacing:0.3em;text-transform:uppercase;font-size:0.8rem;color:var(--blue);}
  #loader.hidden{opacity:0;pointer-events:none;}

  /* ---------- planet holo panel ---------- */
  .planet-holo{
    position:fixed;left:50%;bottom:6.5rem;transform:translateX(-50%) translateY(20px);
    width:min(520px,88vw);z-index:20;
    background:linear-gradient(160deg,rgba(10,20,28,0.82),rgba(6,10,14,0.9));
    border:1px solid rgba(63,200,255,0.55);border-radius:10px;
    padding:1.3rem 1.5rem;backdrop-filter:blur(4px);
    box-shadow:0 0 40px rgba(63,200,255,0.2), inset 0 0 40px rgba(63,200,255,0.05);
    opacity:0;transition:opacity .5s ease, transform .5s ease;
    pointer-events:none;
  }
  .planet-holo.visible{opacity:1;transform:translateX(-50%) translateY(0);}
  .planet-holo::before{
    content:"";position:absolute;left:0;right:0;height:2px;top:0;
    background:linear-gradient(90deg,transparent,var(--blue),transparent);
    animation:holoscan 3s linear infinite;opacity:0.8;
  }
  @keyframes holoscan{0%{top:0%;}100%{top:100%;}}
  .planet-holo-title{
    font-family:'Orbitron',sans-serif;font-size:0.85rem;letter-spacing:0.06em;color:var(--blue);
    text-transform:uppercase;margin-bottom:0.7rem;display:flex;align-items:center;gap:0.5rem;
  }
  .planet-holo-title::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 8px 2px rgba(63,200,255,0.8);}
  .planet-holo-body{font-size:0.85rem;line-height:1.6;color:var(--text);}
  .planet-holo-body ul{list-style:none;padding:0;}
  .planet-holo-body li{padding-left:1.1rem;position:relative;margin-bottom:0.3rem;}
  .planet-holo-body li::before{content:"▸";position:absolute;left:0;color:var(--blue);}
  .planet-name{
    position:fixed;left:50%;bottom:16.5rem;transform:translateX(-50%);
    font-family:'Orbitron',sans-serif;font-size:1.1rem;letter-spacing:0.2em;text-transform:uppercase;
    color:var(--gold-light);text-shadow:0 0 20px rgba(217,169,74,0.6);z-index:20;
    opacity:0;transition:opacity .5s ease;pointer-events:none;
  }
  .planet-name.visible{opacity:1;}

  /* ---------- next button ---------- */
  #next-btn{
    position:fixed;bottom:2.2rem;left:50%;transform:translateX(-50%);z-index:25;
    font-family:'Barlow Condensed',sans-serif;font-size:0.85rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;
    padding:0.9rem 2.2rem;border-radius:3px;border:1px solid var(--gold);color:#0a0a0a;
    background:linear-gradient(135deg,var(--gold),var(--ember));cursor:pointer;
    box-shadow:0 0 25px rgba(217,169,74,0.35);
    transition:opacity .4s ease, transform .2s ease;
  }
  #next-btn:hover{transform:translateX(-50%) translateY(-3px);}
  #next-btn.hidden{opacity:0;pointer-events:none;}

  /* ---------- progress dots ---------- */
  #progress{
    position:fixed;bottom:5.6rem;left:50%;transform:translateX(-50%);z-index:25;
    display:flex;gap:0.5rem;
  }
  #progress span{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.2);transition:background .3s, transform .3s;}
  #progress span.active{background:var(--gold);transform:scale(1.3);}

  /* ---------- earth click prompt / lake click prompt ---------- */
  .click-prompt{
    position:fixed;z-index:22;transform:translate(-50%,-50%);
    font-family:'Orbitron',sans-serif;font-size:0.8rem;letter-spacing:0.25em;text-transform:uppercase;
    color:var(--blue);text-shadow:0 0 15px rgba(63,200,255,0.9);
    padding:0.6rem 1.2rem;border:1px solid rgba(63,200,255,0.6);border-radius:3px;
    background:rgba(5,10,15,0.4);backdrop-filter:blur(2px);
    cursor:pointer;opacity:0;pointer-events:none;
    animation:promptpulse 1.6s ease-in-out infinite;
    white-space:nowrap;
  }
  .click-prompt.visible{opacity:1;pointer-events:auto;}
  @keyframes promptpulse{0%,100%{box-shadow:0 0 8px rgba(63,200,255,0.3);}50%{box-shadow:0 0 22px rgba(63,200,255,0.8);}}

  /* ---------- flash / glitch overlay ---------- */
  #flash{position:fixed;inset:0;z-index:90;background:#fff;opacity:0;pointer-events:none;}
  #glitch{position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0;mix-blend-mode:screen;}
  #glitch .g1,#glitch .g2{position:absolute;inset:0;}
  #glitch .g1{background:rgba(255,0,80,0.5);}
  #glitch .g2{background:rgba(0,200,255,0.5);}

  /* ---------- dimension UI: price tag + product selector + order ---------- */
  #dim-ui{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;}
  .price-tag{
    position:fixed;top:6.5rem;left:50%;transform:translateX(-50%);
    text-align:center;pointer-events:none;
    opacity:0;transition:opacity .8s ease;
  }
  .price-tag.visible{opacity:1;}
  .price-tag .label{
    font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;letter-spacing:0.3em;text-transform:uppercase;
    color:var(--blue);margin-bottom:0.3rem;
  }
  .price-tag .amount{
    font-family:'Orbitron',sans-serif;font-size:2.2rem;font-weight:900;color:var(--gold-light);
    text-shadow:0 0 25px rgba(217,169,74,0.6);
  }
  .price-tag .amount .edit-hint{
    display:block;font-family:'Barlow Condensed',sans-serif;font-size:0.6rem;letter-spacing:0.1em;
    color:rgba(255,255,255,0.3);text-transform:none;margin-top:0.2rem;
  }

  .color-picker{
    position:fixed;bottom:11.5rem;left:50%;transform:translateX(-50%);
    display:flex;gap:0.9rem;z-index:25;pointer-events:auto;
    opacity:0;transition:opacity .8s ease;
  }
  .color-picker.visible{opacity:1;}
  .color-dot{
    width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:2px solid rgba(255,255,255,0.25);transition:border-color .25s, transform .25s;
    position:relative;
  }
  .color-dot:hover{transform:scale(1.1);}
  .color-dot.active{border-color:var(--blue);box-shadow:0 0 16px rgba(63,200,255,0.7);}
  .color-dot[data-color="vert"]{background:#5a7052;}
  .color-dot[data-color="beige"]{background:#cdbd93;}
  .color-dot[data-color="noir"]{background:#232323;}

  .order-row{
    position:fixed;bottom:2.2rem;left:50%;transform:translateX(-50%);
    display:flex;gap:0.7rem;flex-wrap:wrap;justify-content:center;z-index:25;
    pointer-events:auto;opacity:0;transition:opacity .8s ease;max-width:92vw;
  }
  .order-row.visible{opacity:1;}
  .order-btn{
    display:inline-flex;align-items:center;gap:0.5rem;
    font-family:'Barlow Condensed',sans-serif;font-size:0.78rem;font-weight:600;
    letter-spacing:0.1em;text-transform:uppercase;
    padding:0.65rem 1.2rem;border-radius:3px;border:1px solid transparent;color:#fff;
    transition:transform .2s, filter .2s;text-decoration:none;
  }
  .order-btn svg{width:16px;height:16px;flex-shrink:0;fill:currentColor;}
  .order-btn:hover{transform:translateY(-2px);filter:brightness(1.12);}
  .order-btn--insta{background:linear-gradient(135deg,rgba(254,218,117,0.7) 0%,rgba(250,126,30,0.7) 25%,rgba(214,41,118,0.7) 50%,rgba(150,47,191,0.7) 75%,rgba(79,91,213,0.7) 100%);border-color:rgba(214,41,118,0.7);}
  .order-btn--snap{background:rgba(255,252,0,0.85);color:#111;border-color:rgba(255,252,0,0.9);}
  .order-btn--gmail{background:linear-gradient(135deg,rgba(234,67,53,0.7) 0%,rgba(251,188,5,0.55) 50%,rgba(66,133,244,0.7) 100%);border-color:rgba(234,67,53,0.7);}

  .skip-link{
    position:fixed;bottom:1rem;right:1.2rem;z-index:26;
    font-family:'Barlow Condensed',sans-serif;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;
    color:rgba(255,255,255,0.35);text-decoration:underline;cursor:pointer;pointer-events:auto;
  }
  .skip-link:hover{color:rgba(255,255,255,0.7);}

  @media (max-width:720px){
    .planet-holo{bottom:6rem;padding:1rem 1.1rem;}
    .price-tag .amount{font-size:1.6rem;}
    .order-btn{font-size:0.7rem;padding:0.55rem 0.9rem;}
  }
</style>
</head>

<script type="module">
import * as THREE from './assets/js/three.module.min.js';

/* ============================================================
   DONNÉES
   ============================================================ */
const holoContent = {
  description: {
    title: "1 — Description",
    body: "<p>Le tabouret pliant avec sac à dos intégré est pratique, élégant et multifonction. Il se transforme en quelques secondes d'un sac de transport à un tabouret confortable, idéal pour toutes vos activités en plein air.</p>"
  },
  avantages: {
    title: "2 — Les avantages",
    body: "<ul><li>Portable : se porte à la main ou en bandoulière.</li><li>Stable : supporte jusqu'à 120 kg (240 lb).</li><li>Pratique : transformation rapide du sac en tabouret.</li><li>Durable : tissu épais et structure en acier au carbone.</li></ul>"
  },
  caracteristiques: {
    title: "3 — Caractéristiques",
    body: "<ul><li>Poids : 700 g</li><li>Capacité de charge : 120 kg (240 lb)</li><li>Matériau : acier au carbone</li><li>Tissu : épais et résistant</li><li>Pliable : oui</li><li>Style : moderne</li></ul>"
  },
  couleurs: {
    title: "4 — Couleurs disponibles",
    body: "<ul><li>Noir</li><li>Vert</li><li>Kaki</li></ul>"
  },
  utilisations: {
    title: "5 — Utilisations",
    body: "<p>Convient pour :</p><ul><li>Camping</li><li>Jardin</li><li>Cour</li><li>Pêche</li><li>Pique-nique</li><li>Activités de plein air</li><li>Événements sportifs</li><li>Voyages</li></ul>"
  }
};

const PLANETS = [
  { name:"Jupiter", c1:0xd8ab6d, c2:0x8a5a2e, size:3.4, ring:false, key:"description" },
  { name:"Saturne", c1:0xe6d2a8, c2:0xb7955f, size:3.0, ring:true,  key:"avantages" },
  { name:"Uranus",  c1:0x9fe8e0, c2:0x4fb8b0, size:2.1, ring:false, key:"caracteristiques" },
  { name:"Neptune", c1:0x4169e1, c2:0x1e3f8f, size:2.1, ring:false, key:"couleurs" },
  { name:"Mars",    c1:0xc1440e, c2:0x7a2c0a, size:1.5, ring:false, key:"utilisations" },
  { name:"Terre",   c1:0x2a6fdb, c2:0x1a4a8f, size:1.7, ring:false, key:null, isEarth:true }
];

/* ============================================================
   SETUP RENDERER / SCENE / CAMERA
   ============================================================ */
const canvas = document.getElementById('scene-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 4000);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* helper: canvas gradient texture for planets */
function planetTexture(c1, c2){
  const size = 256;
  const cnv = document.createElement('canvas'); cnv.width = size; cnv.height = size;
  const ctx = cnv.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,size);
  const col1 = '#' + c1.toString(16).padStart(6,'0');
  const col2 = '#' + c2.toString(16).padStart(6,'0');
  grad.addColorStop(0, col1);
  grad.addColorStop(1, col2);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,size,size);
  // bandes subtiles
  ctx.globalAlpha = 0.12;
  for(let i=0;i<10;i++){
    ctx.fillStyle = i%2===0 ? '#ffffff' : '#000000';
    ctx.fillRect(0, i*size/10, size, size/20);
  }
  ctx.globalAlpha = 1;
  const tex = new THREE.CanvasTexture(cnv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ============================================================
   STARFIELD (utilisé espace + effet hyperspace)
   ============================================================ */
const STAR_COUNT = 2600;
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(STAR_COUNT*3);
const starBase = [];
for(let i=0;i<STAR_COUNT;i++){
  const x = (Math.random()-0.5)*1600;
  const y = (Math.random()-0.5)*1600;
  const z = (Math.random()-0.5)*1600;
  starPos[i*3]=x; starPos[i*3+1]=y; starPos[i*3+2]=z;
  starBase.push(new THREE.Vector3(x,y,z));
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:1.4, sizeAttenuation:true, transparent:true, opacity:0.85 });
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

/* ============================================================
   LUMIÈRES
   ============================================================ */
const ambient = new THREE.AmbientLight(0x8899bb, 0.55);
scene.add(ambient);
const sunLight = new THREE.PointLight(0xffe8c0, 3.2, 0, 0.35);
sunLight.position.set(300, 120, -200);
scene.add(sunLight);
const fillLight = new THREE.DirectionalLight(0x3fc8ff, 0.4);
fillLight.position.set(-100, 50, 100);
scene.add(fillLight);

/* ============================================================
   GROUPE ESPACE : planètes le long d'un chemin
   ============================================================ */
const spaceGroup = new THREE.Group();
scene.add(spaceGroup);

const planetMeshes = [];
const waypoints = [];
let zCursor = 0;
PLANETS.forEach((p, i) => {
  const geo = new THREE.SphereGeometry(p.size, 48, 48);
  const mat = new THREE.MeshStandardMaterial({ map:planetTexture(p.c1,p.c2), roughness:0.85, metalness:0.05 });
  const mesh = new THREE.Mesh(geo, mat);
  zCursor -= (p.size*7 + 26);
  mesh.position.set(Math.sin(i*1.3)*6, Math.cos(i*0.8)*3, zCursor);
  spaceGroup.add(mesh);
  planetMeshes.push(mesh);

  if(p.ring){
    const ringGeo = new THREE.RingGeometry(p.size*1.4, p.size*2.1, 64);
    const ringMat = new THREE.MeshBasicMaterial({ color:0xd8c9a0, side:THREE.DoubleSide, transparent:true, opacity:0.55 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2.3;
    ring.position.copy(mesh.position);
    spaceGroup.add(ring);
  }

  // glow sprite
  const glowTex = (() => {
    const s=128; const c=document.createElement('canvas'); c.width=c.height=s;
    const ctx=c.getContext('2d');
    const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    const col = '#'+p.c1.toString(16).padStart(6,'0');
    g.addColorStop(0, col+'aa'); g.addColorStop(1, col+'00');
    ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
    return new THREE.CanvasTexture(c);
  })();
  const glowMat = new THREE.SpriteMaterial({ map:glowTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
  const glow = new THREE.Sprite(glowMat);
  glow.scale.set(p.size*4.2, p.size*4.2, 1);
  glow.position.copy(mesh.position);
  spaceGroup.add(glow);

  // point de vue caméra en face de la planète
  const camPos = mesh.position.clone().add(new THREE.Vector3(0, p.size*0.4, p.size*4.5));
  waypoints.push({ camPos, lookAt: mesh.position.clone(), planet:p, mesh });
});

camera.position.copy(waypoints[0].camPos).add(new THREE.Vector3(0,0,40));
camera.lookAt(waypoints[0].lookAt);

/* ============================================================
   GROUPE LAC D'OESCHINEN
   ============================================================ */
const lakeGroup = new THREE.Group();
lakeGroup.visible = false;
scene.add(lakeGroup);

// ciel dégradé (sphère inversée)
const skyGeo = new THREE.SphereGeometry(500, 32, 32);
const skyCanvas = document.createElement('canvas'); skyCanvas.width=2; skyCanvas.height=256;
const skyCtx = skyCanvas.getContext('2d');
const skyGrad = skyCtx.createLinearGradient(0,0,0,256);
skyGrad.addColorStop(0,'#7fc8e8'); skyGrad.addColorStop(0.5,'#bfe3e0'); skyGrad.addColorStop(1,'#e8d9a8');
skyCtx.fillStyle = skyGrad; skyCtx.fillRect(0,0,2,256);
const skyTex = new THREE.CanvasTexture(skyCanvas);
const skyMat = new THREE.MeshBasicMaterial({ map:skyTex, side:THREE.BackSide, fog:false });
const sky = new THREE.Mesh(skyGeo, skyMat);
lakeGroup.add(sky);

// eau
const waterGeo = new THREE.PlaneGeometry(400, 400, 80, 80);
const waterMat = new THREE.MeshStandardMaterial({ color:0x2fa9a0, roughness:0.25, metalness:0.35, transparent:true, opacity:0.92 });
const water = new THREE.Mesh(waterGeo, waterMat);
water.rotation.x = -Math.PI/2;
water.position.y = 0;
lakeGroup.add(water);
const waterPosAttr = waterGeo.attributes.position;
const waterBaseZ = Float32Array.from(waterPosAttr.array);

// montagnes
function makeMountain(x,z,scale,color){
  const geo = new THREE.ConeGeometry(scale*1.4, scale*2.6, 6);
  const mat = new THREE.MeshStandardMaterial({ color, roughness:1, flatShading:true });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, scale*1.1, z);
  m.rotation.y = Math.random()*Math.PI;
  lakeGroup.add(m);
  // cime enneigée
  const snowGeo = new THREE.ConeGeometry(scale*0.5, scale*0.7, 6);
  const snowMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.9, flatShading:true });
  const snow = new THREE.Mesh(snowGeo, snowMat);
  snow.position.set(x, scale*2.1, z);
  lakeGroup.add(snow);
}
const mountainColors = [0x5c6b58, 0x4a5548, 0x6b7a63];
for(let i=0;i<9;i++){
  const angle = (i/9)*Math.PI*2;
  const dist = 90 + Math.random()*40;
  makeMountain(Math.cos(angle)*dist, Math.sin(angle)*dist - 60, 22+Math.random()*18, mountainColors[i%3]);
}

// rochers au bord
function makeRock(x,z,scale){
  const geo = new THREE.DodecahedronGeometry(scale, 0);
  const mat = new THREE.MeshStandardMaterial({ color:0x6b6459, roughness:1, flatShading:true });
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, scale*0.4, z);
  m.rotation.set(Math.random(),Math.random(),Math.random());
  lakeGroup.add(m);
  return m;
}
makeRock(-6, 6, 2.2); makeRock(0, 7.5, 1.8); makeRock(6, 6, 2.4);

// les 3 produits posés sur les rochers (plans texturés)
const productTexLoader = new THREE.TextureLoader();
const productTextures = {
  vert: productTexLoader.load('assets/couleurs/vert.png'),
  beige: productTexLoader.load('assets/couleurs/beige.png'),
  noir: productTexLoader.load('assets/couleurs/noir.png')
};
Object.values(productTextures).forEach(t => t.colorSpace = THREE.SRGBColorSpace);

const lakeProducts = [];
const lakeProductColors = ['vert','beige','noir'];
[-6,0,6].forEach((x,i) => {
  const tex = productTextures[lakeProductColors[i]];
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, alphaTest:0.15, side:THREE.DoubleSide });
  const geo = new THREE.PlaneGeometry(4.6, 4.6);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, 2.6, 6);
  lakeGroup.add(mesh);
  lakeProducts.push(mesh);
});

// logo flottant
const logoTexLoader = new THREE.TextureLoader();
const logoTex = logoTexLoader.load('assets/logo-transparent.png');
logoTex.colorSpace = THREE.SRGBColorSpace;
const logoMat = new THREE.MeshBasicMaterial({ map:logoTex, transparent:true });
const logoGeo = new THREE.PlaneGeometry(6, 6);
const logoMesh = new THREE.Mesh(logoGeo, logoMat);
logoMesh.position.set(0, 16, -6);
lakeGroup.add(logoMesh);

// halo autour du logo
const logoGlowMat = new THREE.SpriteMaterial({
  map: (() => {
    const s=256; const c=document.createElement('canvas'); c.width=c.height=s;
    const ctx=c.getContext('2d');
    const g = ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,'rgba(63,200,255,0.55)'); g.addColorStop(1,'rgba(63,200,255,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,s,s);
    return new THREE.CanvasTexture(c);
  })(), transparent:true, blending:THREE.AdditiveBlending, depthWrite:false
});
const logoGlow = new THREE.Sprite(logoGlowMat);
logoGlow.scale.set(14,14,1);
logoGlow.position.copy(logoMesh.position);
lakeGroup.add(logoGlow);

const lakeCamPos = new THREE.Vector3(0, 6, 24);
const lakeLookAt = new THREE.Vector3(0, 6, 0);

/* ============================================================
   GROUPE DIMENSION DIGITALE
   ============================================================ */
const dimGroup = new THREE.Group();
dimGroup.visible = false;
scene.add(dimGroup);

// grille néon au sol
function gridTexture(){
  const size = 512;
  const c = document.createElement('canvas'); c.width=c.height=size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#050608'; ctx.fillRect(0,0,size,size);
  ctx.strokeStyle = 'rgba(63,200,255,0.55)'; ctx.lineWidth = 2;
  const step = size/16;
  for(let i=0;i<=16;i++){
    ctx.beginPath(); ctx.moveTo(i*step,0); ctx.lineTo(i*step,size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,i*step); ctx.lineTo(size,i*step); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(10,10);
  return tex;
}
const gridTex = gridTexture();
const gridMat = new THREE.MeshBasicMaterial({ map:gridTex, transparent:true, opacity:0.55 });
const gridFloor = new THREE.Mesh(new THREE.PlaneGeometry(400,400), gridMat);
gridFloor.rotation.x = -Math.PI/2;
gridFloor.position.y = -6;
dimGroup.add(gridFloor);
const gridFloorTop = new THREE.Mesh(new THREE.PlaneGeometry(400,400), gridMat.clone());
gridFloorTop.rotation.x = Math.PI/2;
gridFloorTop.position.y = 20;
dimGroup.add(gridFloorTop);

// lignes de circuit flottantes
const circuitGroup = new THREE.Group();
for(let i=0;i<26;i++){
  const points = [];
  let x = (Math.random()-0.5)*60, y=(Math.random()-0.5)*20, z=(Math.random()-0.5)*40;
  points.push(new THREE.Vector3(x,y,z));
  for(let j=0;j<3;j++){
    if(Math.random()>0.5) x += (Math.random()-0.5)*10; else y += (Math.random()-0.5)*6;
    points.push(new THREE.Vector3(x,y,z));
  }
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color: Math.random()>0.5?0x3fc8ff:0xd9a94a, transparent:true, opacity:0.35 });
  circuitGroup.add(new THREE.Line(geo, mat));
}
dimGroup.add(circuitGroup);

// 3 cartes produits holographiques (arc face caméra)
const dimProducts = {};
const dimProductAngles = [-22, 0, 22];
lakeProductColors.forEach((color, i) => {
  const g = new THREE.Group();
  const angle = THREE.MathUtils.degToRad(dimProductAngles[i]);
  const dist = 13;
  g.position.set(Math.sin(angle)*dist, 1.5, -Math.cos(angle)*dist + 6);

  const tex = productTextures[color];
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, alphaTest:0.15, side:THREE.DoubleSide });
  const geo = new THREE.PlaneGeometry(5.4, 5.4);
  const mesh = new THREE.Mesh(geo, mat);
  g.add(mesh);

  // anneau holographique derrière
  const ringGeo = new THREE.RingGeometry(3.1, 3.35, 48);
  const ringMat = new THREE.MeshBasicMaterial({ color:0x3fc8ff, transparent:true, opacity:0.5, side:THREE.DoubleSide });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.position.z = -0.3;
  g.add(ring);

  dimGroup.add(g);
  dimProducts[color] = { group:g, mesh, ring };
});

const dimCamPos = new THREE.Vector3(0, 3, 22);
const dimLookAt = new THREE.Vector3(0, 1.5, 6);

/* ============================================================
   ÉTAT / NAVIGATION
   ============================================================ */
let stage = 'space'; // space -> hyperspace -> lake -> tear -> dimension
let currentStop = 0;
let animT = 1; // 0..1 progression du tween caméra
let tweenFrom = { pos:camera.position.clone(), look:waypoints[0].lookAt.clone() };
let tweenTo = { pos:waypoints[0].camPos.clone(), look:waypoints[0].lookAt.clone() };
let hyperT = 0;
let tearT = 0;
let selectedColor = 'vert';

const planetHolo = document.getElementById('planetHolo');
const planetHoloTitle = document.getElementById('planetHoloTitle');
const planetHoloBody = document.getElementById('planetHoloBody');
const planetName = document.getElementById('planetName');
const earthPrompt = document.getElementById('earthPrompt');
const logoPrompt = document.getElementById('logoPrompt');
const nextBtn = document.getElementById('next-btn');
const progressEl = document.getElementById('progress');
const flashEl = document.getElementById('flash');
const glitchEl = document.getElementById('glitch');
const dimUi = document.getElementById('dim-ui');
const priceTag = document.getElementById('priceTag');
const colorPicker = document.getElementById('colorPicker');
const orderRow = document.getElementById('orderRow');
const skipLink = document.getElementById('skipLink');

PLANETS.forEach((p,i) => {
  const dot = document.createElement('span');
  if(i===0) dot.classList.add('active');
  progressEl.appendChild(dot);
});

function showPlanetInfo(index){
  const p = PLANETS[index];
  planetName.textContent = p.name;
  planetName.classList.add('visible');
  [...progressEl.children].forEach((d,i) => d.classList.toggle('active', i===index));

  if(p.isEarth){
    planetHolo.classList.remove('visible');
    earthPrompt.classList.add('visible');
    nextBtn.classList.add('hidden');
  } else {
    earthPrompt.classList.remove('visible');
    nextBtn.classList.remove('hidden');
    const c = holoContent[p.key];
    planetHoloTitle.textContent = c.title;
    planetHoloBody.innerHTML = c.body;
    requestAnimationFrame(() => planetHolo.classList.add('visible'));
  }
}
showPlanetInfo(0);

function goToStop(index){
  if(index >= PLANETS.length) return;
  planetHolo.classList.remove('visible');
  currentStop = index;
  tweenFrom = { pos:camera.position.clone(), look:currentLookAt.clone() };
  tweenTo = { pos:waypoints[index].camPos.clone(), look:waypoints[index].lookAt.clone() };
  animT = 0;
  setTimeout(() => showPlanetInfo(index), 700);
}

let currentLookAt = waypoints[0].lookAt.clone();

nextBtn.addEventListener('click', () => {
  if(stage !== 'space') return;
  goToStop(currentStop+1);
});

earthPrompt.addEventListener('click', () => startHyperspace());

function startHyperspace(){
  stage = 'hyperspace';
  planetHolo.classList.remove('visible');
  planetName.classList.remove('visible');
  earthPrompt.classList.remove('visible');
  nextBtn.classList.add('hidden');
  progressEl.style.display = 'none';
  skipLink.style.display = 'none';
  hyperT = 0;
}

function endHyperspace(){
  spaceGroup.visible = false;
  stars.visible = false;
  lakeGroup.visible = true;
  camera.position.copy(lakeCamPos);
  currentLookAt = lakeLookAt.clone();
  camera.lookAt(currentLookAt);
  stage = 'lake';
  setTimeout(() => logoPrompt.classList.add('visible'), 600);
}

logoPrompt.addEventListener('click', () => startTear());

function startTear(){
  stage = 'tear';
  logoPrompt.classList.remove('visible');
  skipLink.style.display = 'none';
  tearT = 0;
}

function endTear(){
  lakeGroup.visible = false;
  dimGroup.visible = true;
  scene.background = new THREE.Color(0x050a10);
  scene.fog = new THREE.FogExp2(0x050a10, 0.022);
  camera.position.copy(dimCamPos);
  currentLookAt = dimLookAt.clone();
  camera.lookAt(currentLookAt);
  stage = 'dimension';
  dimUi.style.display = 'block';
  requestAnimationFrame(() => {
    priceTag.classList.add('visible');
    colorPicker.classList.add('visible');
    orderRow.classList.add('visible');
  });
}

colorPicker.addEventListener('click', (e) => {
  const dot = e.target.closest('.color-dot');
  if(!dot) return;
  selectedColor = dot.getAttribute('data-color');
  [...colorPicker.children].forEach(d => d.classList.toggle('active', d===dot));
  Object.entries(dimProducts).forEach(([color, obj]) => {
    const isSel = color === selectedColor;
    const targetScale = isSel ? 1.15 : 0.85;
    obj.group.userData.targetScale = targetScale;
    obj.ring.material.opacity = isSel ? 0.9 : 0.25;
  });
});
// init state
Object.entries(dimProducts).forEach(([color, obj]) => {
  obj.group.userData.targetScale = color === selectedColor ? 1.15 : 0.85;
  obj.ring.material.opacity = color === selectedColor ? 0.9 : 0.25;
});

skipLink.addEventListener('click', () => {
  if(stage === 'space'){ startHyperspace(); }
  else if(stage === 'lake'){ startTear(); }
});

/* clic direct sur une planète / sur le logo (raycaster) */
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
canvas.addEventListener('click', (e) => {
  mouseNDC.x = (e.clientX/window.innerWidth)*2-1;
  mouseNDC.y = -(e.clientY/window.innerHeight)*2+1;
  raycaster.setFromCamera(mouseNDC, camera);
  if(stage === 'space'){
    const hit = raycaster.intersectObject(waypoints[currentStop].mesh)[0];
    if(hit){
      if(PLANETS[currentStop].isEarth) startHyperspace();
      else goToStop(currentStop+1);
    }
  } else if(stage === 'lake'){
    const hit = raycaster.intersectObject(logoMesh)[0];
    if(hit) startTear();
  }
});

/* ============================================================
   BOUCLE D'ANIMATION
   ============================================================ */
const clock = new THREE.Clock();

function easeInOut(t){ return t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2; }

function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.getElapsedTime();

  planetMeshes.forEach(m => m.rotation.y += dt*0.06);

  if(stage === 'space'){
    if(animT < 1){
      animT = Math.min(1, animT + dt*0.6);
      const e = easeInOut(animT);
      camera.position.lerpVectors(tweenFrom.pos, tweenTo.pos, e);
      currentLookAt.lerpVectors(tweenFrom.look, tweenTo.look, e);
      camera.lookAt(currentLookAt);
    } else {
      camera.position.x += Math.sin(t*0.3)*0.003;
      camera.lookAt(currentLookAt);
    }
  }

  if(stage === 'hyperspace'){
    hyperT += dt;
    const speed = Math.min(hyperT*hyperT*400, 900);
    const posAttr = starGeo.attributes.position;
    for(let i=0;i<STAR_COUNT;i++){
      posAttr.array[i*3+2] += dt*speed;
      if(posAttr.array[i*3+2] > 200){
        posAttr.array[i*3+2] = -1400;
      }
    }
    posAttr.needsUpdate = true;
    starMat.size = 1.4 + hyperT*3;
    camera.fov = 55 + Math.min(hyperT*40, 45);
    camera.updateProjectionMatrix();
    if(hyperT > 1.6){
      flashEl.style.transition = 'opacity .15s ease';
      flashEl.style.opacity = '1';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 160);
      camera.fov = 55; camera.updateProjectionMatrix();
      endHyperspace();
    }
  }

  if(stage === 'tear'){
    tearT += dt;
    glitchEl.style.opacity = Math.min(tearT*3,1)*(0.6+0.4*Math.sin(t*60));
    glitchEl.querySelector('.g1').style.transform = `translateX(${Math.sin(t*80)*12}px)`;
    glitchEl.querySelector('.g2').style.transform = `translateX(${-Math.sin(t*70)*12}px)`;
    logoGlow.scale.setScalar(14 + Math.sin(t*40)*3);
    if(tearT > 0.9){
      flashEl.style.transition = 'opacity .2s ease';
      flashEl.style.opacity = '1';
      glitchEl.style.opacity = '0';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 220);
      endTear();
    }
  }

  if(stage === 'lake'){
    const posAttr = waterGeo.attributes.position;
    for(let i=0;i<posAttr.count;i++){
      const ix = i*3;
      const bx = waterBaseZ[ix], by = waterBaseZ[ix+1];
      posAttr.array[ix+2] = Math.sin(bx*0.15 + t*1.2)*0.15 + Math.cos(by*0.12 + t*0.9)*0.15;
    }
    posAttr.needsUpdate = true;
    logoMesh.position.y = 16 + Math.sin(t*0.8)*0.4;
    logoMesh.rotation.y = Math.sin(t*0.3)*0.15;
    logoGlow.position.copy(logoMesh.position);
    lakeProducts.forEach((m,i) => { m.position.y = 2.6 + Math.sin(t*1.1 + i)*0.08; });

    // projeter le logo en coordonnées écran pour positionner le prompt
    const v = logoMesh.position.clone();
    v.y -= 4.8;
    v.project(camera);
    const sx = (v.x*0.5+0.5)*window.innerWidth;
    const sy = (-v.y*0.5+0.5)*window.innerHeight;
    logoPrompt.style.left = sx+'px';
    logoPrompt.style.top = sy+'px';
  }

  if(stage === 'dimension'){
    Object.values(dimProducts).forEach(obj => {
      obj.mesh.rotation.y += dt*0.9;
      obj.ring.rotation.z += dt*0.15;
      const target = obj.group.userData.targetScale || 1;
      const cur = obj.group.scale.x;
      const next = cur + (target-cur)*dt*4;
      obj.group.scale.setScalar(next);
    });
    circuitGroup.rotation.y += dt*0.02;
    gridFloor.material.map.offset.y -= dt*0.02;
    gridFloorTop.material.map.offset.y += dt*0.015;
    camera.position.x = dimCamPos.x + Math.sin(t*0.15)*1.2;
    camera.lookAt(currentLookAt);
  }

  renderer.render(scene, camera);
}

/* ============================================================
   BOOT
   ============================================================ */
setTimeout(() => {
  document.getElementById('loader').classList.add('hidden');
}, 900);

animate();
</script>
